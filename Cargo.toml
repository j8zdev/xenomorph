[package]
name = "xenomorph"
version = "0.1.0"
edition = "2024"
description = "Spots the foreign shapes in your XML: compares the shape of two XML files and lists the differences as findings"
authors = ["Julian Kurz"]
license = "MIT"
homepage = "https://j8z.dev"
repository = "https://github.com/j8zdev/xenomorph"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5.4.5"
regex-lite = "0.1.9"
rfd = "0.18.0"
roxmltree = "0.21.2"
slint = "1.19.0"
strsim = "0.11.1"

[build-dependencies]
slint-build = "1.19.0"

# Not used directly: enables loading fontconfig at runtime (dlopen) so the
# build needs neither pkg-config nor fontconfig headers.
[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
